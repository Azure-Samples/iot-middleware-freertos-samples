name: Linux CI Tests

on: 
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: docker://espressif/idf@sha256:cb1f712286e5016b28b2dffc26cf6315132e5416ebc012b94fe09750d908dd1d # v4.4.3
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Style Check
      run: .github/scripts/code_style.sh check
    - name: Submodules Init
      uses: snickerbockers/submodules-init@74927a8bb0fe1bb0f1f1e4d102384a8e69f19171 # v4
    - name: Configure
      run: .github/scripts/install_software.sh
    - name: Install ARM GCC 11.2
      run: .github/scripts/install_arm_gcc.sh
    - name: Build PC Samples
      run: sudo bash -c ".github/scripts/ci_tests.sh -pc"
    - name: Build NXP Samples
      run: sudo bash -c ".github/scripts/ci_tests.sh -nxp"
    - name: Build ST Samples
      run: sudo bash -c ".github/scripts/ci_tests.sh -st"
    - name: Build ESP32 Samples (ESP-IDF v4.4.3)
      run: docker run -v "${PWD}:/iot-middleware-freertos-samples" -w /iot-middleware-freertos-samples espressif/idf@sha256:cb1f712286e5016b28b2dffc26cf6315132e5416ebc012b94fe09750d908dd1d .github/scripts/ci_tests.sh -esp
    - name: Build ESP32-ATECC Samples (ESP-IDF v4.4.3)
      run: docker run -v "${PWD}:/iot-middleware-freertos-samples" -w /iot-middleware-freertos-samples espressif/idf@sha256:cb1f712286e5016b28b2dffc26cf6315132e5416ebc012b94fe09750d908dd1d .github/scripts/ci_tests.sh -esp-atecc
